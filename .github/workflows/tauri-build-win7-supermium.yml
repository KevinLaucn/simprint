name: tauri-build-win7-supermium-online

on:
  push:
    branches:
      - win7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: win7-supermium-online
  cancel-in-progress: true

jobs:
  build-win7:
    runs-on: windows-2025

    env:
      ENV_NAME: production
      SIMPRINT_WEBVIEW_MODE: win7-offline
      WIN7_TARGET: x86_64-win7-windows-msvc
      RUST_TOOLCHAIN: nightly-2026-09-01
      WEBVIEW_VERSION: 109.0.1518.78
      WEBVIEW_URL: https://github.com/westinyang/WebView2RuntimeArchive/releases/download/109.0.1518.78/Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.x64.cab
      TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

    steps:
      - name: Checkout Simprint
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup pinned Rust nightly with rust-src
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rust-src

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release signing keys
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY)) {
            throw "TAURI_UPDATER_PUBLIC_KEY is missing. Configure the repository secret before building Win7 releases."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_PRIVATE_KEY is missing. Configure the repository secret before building Win7 releases."
          }
          if ($null -eq $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw "TAURI_KEY_PASSWORD is missing. Set it to an empty secret if the key has no password."
          }
          Write-Host "Using the stable repository updater signing key."

      - name: Bundle Microsoft WebView2 109 fixed runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $cab = Join-Path $env:RUNNER_TEMP "webview2-109-x64.cab"
          $extract = Join-Path $env:RUNNER_TEMP "webview2-109-extract"
          $target = "src-tauri/webview-fixed/Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.x64"

          Remove-Item $cab -Force -ErrorAction SilentlyContinue
          & curl.exe -L --fail --retry 5 --retry-delay 2 --connect-timeout 30 --output $cab $env:WEBVIEW_URL
          if ($LASTEXITCODE -ne 0) { throw "WebView2 download failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $cab)) { throw "WebView2 CAB was not downloaded" }
          $cabInfo = Get-Item $cab
          if ($cabInfo.Length -lt 150MB) { throw "WebView2 CAB is unexpectedly small: $($cabInfo.Length) bytes" }

          Remove-Item $extract -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & expand.exe '-F:*' $cab $extract | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "expand.exe failed with exit code $LASTEXITCODE" }

          $webviewExe = Get-ChildItem $extract -Recurse -File -Filter "msedgewebview2.exe" | Select-Object -First 1
          if (-not $webviewExe) { throw "msedgewebview2.exe not found after extracting WebView2 109" }

          $sig = Get-AuthenticodeSignature $webviewExe.FullName
          if ($sig.Status -ne 'Valid') { throw "WebView2 executable signature is not valid: $($sig.Status)" }
          if (-not $sig.SignerCertificate -or $sig.SignerCertificate.Subject -notmatch 'Microsoft') {
            throw "WebView2 executable is not signed by Microsoft"
          }

          Remove-Item $target -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item (Join-Path $webviewExe.Directory.FullName '*') $target -Recurse -Force
          Write-Host "Bundled WebView2: $($webviewExe.Directory.FullName)"
          Write-Host "Signer: $($sig.SignerCertificate.Subject)"

      - name: Prepare Win7 Tauri config with public key injection
        run: node deploy/prepare-tauri-config.mjs win7-offline x86_64-win7-windows-msvc

      - name: Prepare Win7 build version
        shell: powershell
        env:
          VERSION: 0.1.${{ github.run_number }}
        run: node deploy/prepare-version.mjs

      - name: Install PE inspection dependency
        run: python -m pip install pefile

      - name: Hide rustup for the Win7 Tier-3 target
        shell: powershell
        run: |
          $rustup = Get-Command rustup.exe -ErrorAction SilentlyContinue
          if ($rustup) {
            $hidden = "$($rustup.Source).simprint-win7-hidden"
            if (Test-Path $hidden) { Remove-Item $hidden -Force }
            Move-Item -LiteralPath $rustup.Source -Destination $hidden -Force
            Write-Host "Temporarily hid rustup.exe before invoking Tauri CLI."
          }

      - name: Apply Win7 UI overlay and build frontend
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/before-build-win7.ps1

      - name: Build Win7 Tauri installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SIMPRINT_WEBVIEW_MODE: win7-offline
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          args: --target x86_64-win7-windows-msvc --features production,win7-offline

      - name: Collect and verify installer assets
        id: collect
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $out = "dist-win7"
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $nsisDir = "src-tauri/target/$env:WIN7_TARGET/release/bundle/nsis"
          $installer = Get-ChildItem $nsisDir -Filter *.exe -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found under $nsisDir" }

          $finalExe = Join-Path $out "Simprint-Win7-x64.exe"
          Copy-Item $installer.FullName $finalExe -Force
          $info = Get-Item $finalExe
          Write-Host ("Installer: {0}; size: {1:N1} MB" -f $info.FullName, ($info.Length / 1MB))

          # 1. 检查安装包体积（必须大于 150MB，确保 WebView2 和 Supermium 已打包进入）
          if ($info.Length -lt 150MB) {
            throw "Installer is unexpectedly small ($($info.Length) bytes). Bundled WebView2 or Supermium may be missing."
          }

          # 2. 解包安装包以严格验证内嵌组件与 PE 兼容性
          $unpackDir = Join-Path $env:RUNNER_TEMP "installer-unpack"
          Remove-Item $unpackDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $unpackDir | Out-Null

          Write-Host "Unpacking installer using 7-Zip to inspect resources..."
          & 7z.exe x -y -o"$unpackDir" $finalExe | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z unpack failed with exit code $LASTEXITCODE" }

          # 验证 WebView2 109 核心文件存在
          $foundWebview = Get-ChildItem $unpackDir -Recurse -Filter "msedgewebview2.exe" | Select-Object -First 1
          if (-not $foundWebview) { throw "Verification failed: msedgewebview2.exe not found in unpacked installer!" }
          Write-Host "Verified WebView2 inside installer: $($foundWebview.FullName)"

          # 3. 递归扫描解包后的全部 .exe 和 .dll，严格门禁 Windows 10+ 专属符号 (如 ProcessPrng)
          python scripts/check-win7-pe.py $unpackDir
          if ($LASTEXITCODE -ne 0) { throw "check-win7-pe.py inspection failed on installer binaries!" }

          # 4. 提取 Tauri updater 签名文件
          $sigFile = Get-ChildItem $nsisDir -Filter "$($installer.Name).sig" -File | Select-Object -First 1
          if (-not $sigFile) {
            $sigFile = Get-ChildItem $nsisDir -Filter "*.sig" -File | Select-Object -First 1
          }
          if (-not $sigFile) {
            throw "Updater signature file (.sig) not found under $nsisDir"
          }

          $finalSig = Join-Path $out "Simprint-Win7-x64.exe.sig"
          Copy-Item $sigFile.FullName $finalSig -Force
          $sigContent = (Get-Content $finalSig -Raw).Trim()
          Write-Host "Signature extracted: $sigContent"

          # 5. 生成专用的 latest-win7.json 独立更新清单
          $tag = "win7-latest"
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/Simprint-Win7-x64.exe"
          $appVersion = (Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version

          $manifest = [ordered]@{
            version = $appVersion
            notes = "Simprint Windows 7 x64 compatibility release. Downloads pinned Supermium on first use and includes WebView2 109."
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigContent
                url = $downloadUrl
              }
            }
          }

          $manifestJson = $manifest | ConvertTo-Json -Depth 5
          $manifestPath = Join-Path $out "latest-win7.json"
          [IO.File]::WriteAllText($manifestPath, $manifestJson, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host "Generated updater manifest: $manifestPath"
          Get-Content $manifestPath

      - name: Upload Win7 release assets artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simprint-Win7-x64-Release
          path: dist-win7/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Publish Win7 Release with manifest and signatures
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "win7-latest"
          gh release view $tag --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Simprint Win7 latest" --notes "Rolling Windows 7 x64 compatibility release."
          }
          gh release upload $tag `
            "dist-win7/Simprint-Win7-x64.exe" `
            "dist-win7/Simprint-Win7-x64.exe.sig" `
            "dist-win7/latest-win7.json" `
            --repo "${{ github.repository }}" `
            --clobber
